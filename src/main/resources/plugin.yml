name: ArmorHide
version: 1.0.0
main: com.mc.armorhide.ArmorHide
api-version: 1.21
folia-supported: true
depend: [ProtocolLib]
description: Hide your armor from other players, or wear any item as a cosmetic hat.
author: sinbte
commands:
  hidearmor:
    description: Toggle armor visibility for other players
    usage: /hidearmor
    aliases: [togglearmor]
  cosmetichat:
    description: Set a held item as a cosmetic hat visible to others
    usage: /cosmetichat [off]
    aliases: [hat]
